name: AI新闻定时推送
on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0:00 = 北京时间8:00
  workflow_dispatch:  # 支持手动触发

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 触发AI新闻工作流
        run: |
          curl -X POST "z5skwct397.coze.site/api/run" \
            -H "Content-Type: application/json" \
            -d '{"search_query": "AI行业最新新闻"}'
