name: AI新闻定时推送
on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0:00 = 北京时间8:00
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 触发AI新闻工作流
        run: |
          curl --location --request POST 'https://z5skwct397.coze.site/run' \
            --header 'Authorization: Bearer ${{ secrets.COZE_API_TOKEN }}' \
            --header 'Content-Type: application/json' \
            --data '{"search_query":"AI行业最新新闻"}'
